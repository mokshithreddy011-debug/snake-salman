
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake-Salman</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#080d09;color:white;font-family:Arial,sans-serif}
#app{height:100dvh;width:100vw;display:flex;flex-direction:column}
header{
 padding:10px 16px;background:#101810;border-bottom:1px solid #304332;
 display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;z-index:2
}
.brand{font-size:21px;font-weight:900;color:#a8e68a;letter-spacing:1px}
.stats,.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stats{font-weight:bold;font-size:13px}
.stats span{color:#e6c47a;font-size:17px}
button,select{
 background:#1b291e;color:white;border:1px solid #496448;
 padding:9px 12px;border-radius:8px;cursor:pointer
}
button:hover{background:#345039}
main{position:relative;flex:1;min-height:0;width:100%;padding:0}
canvas{width:100%;height:100%;display:block;background:#09120b;touch-action:none}
.overlay{
 position:absolute;inset:0;background:#030804e8;z-index:5;
 display:flex;align-items:center;justify-content:center;padding:15px
}
.hidden{display:none!important}
.panel{
 width:min(440px,95%);padding:28px;text-align:center;
 background:linear-gradient(145deg,#19291c,#0b120d);
 border:1px solid #58764f;border-radius:20px;box-shadow:0 15px 70px #000
}
.panel h2{font-size:32px;color:#b4ed96;margin:0 0 10px}
.panel p{color:#c4d1c3;line-height:1.6}
.primary{background:#477d3e!important;padding:13px 28px;font-size:17px}
#notice{
 position:absolute;top:15px;left:50%;transform:translateX(-50%);
 z-index:3;color:#fff0a7;font-weight:bold;text-align:center;
 pointer-events:none;text-shadow:0 2px 5px #000
}
#timer{position:absolute;top:15px;right:20px;z-index:3;color:#fff0a7;font-weight:bold}
#mobile{
 display:none;position:absolute;bottom:12px;left:50%;
 transform:translateX(-50%);grid-template-columns:repeat(3,44px);gap:4px;z-index:4
}
#mobile button{height:40px;font-size:18px;padding:4px}
.empty{visibility:hidden}
@media(max-width:700px){
 header{justify-content:center;padding:7px;gap:6px}
 .brand{width:100%;text-align:center;font-size:18px}
 .stats{justify-content:center;gap:9px;font-size:11px}
 .stats span{font-size:14px}
 .tools{justify-content:center;gap:4px}
 .tools button,.tools select{padding:7px;font-size:11px}
 #mobile{display:grid}
 #timer{top:auto;bottom:145px;right:10px;font-size:11px}
 #notice{top:7px;font-size:12px}
 .panel{padding:22px}
}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="brand">🐍 SNAKE-SALMAN</div>
 <div class="stats">
  <div>SCORE <span id="score">0</span></div>
  <div>BEST <span id="best">0</span></div>
  <div>LEVEL <span id="level">NORMAL</span></div>
 </div>
 <div class="tools">
  <select id="difficulty" aria-label="Difficulty">
   <option value="260">Easy</option>
   <option value="220" selected>Normal</option>
   <option value="180">Hard</option>
  </select>
  <select id="snakeColor" aria-label="Snake colour">
   <option value="#75ae57">Forest green</option>
   <option value="#c49b4b">Golden</option>
   <option value="#568bb5">Ocean blue</option>
   <option value="#b56b86">Pink</option>
  </select>
  <button id="pauseBtn">Pause</button>
  <button id="restartBtn">Restart</button>
  <button id="fullBtn">⛶ Fullscreen</button>
 </div>
</header>

<main id="gameShell">
 <canvas id="game"></canvas>
 <div id="notice"></div>
 <div id="timer"></div>

 <div id="startScreen" class="overlay">
  <div class="panel">
   <div style="font-size:48px">🐍</div>
   <h2>SNAKE-SALMAN</h2>
   <p>THE BOOK HUNTER</p>
   <p>Collect books, grow your snake and hunt for the magical marksheet!</p>
   <p>Use arrow keys or WASD to move.</p>
   <button class="primary" id="startBtn">START GAME</button>
  </div>
 </div>

 <div id="pauseScreen" class="overlay hidden">
  <div class="panel">
   <h2>PAUSED</h2>
   <button class="primary" id="resumeBtn">RESUME</button>
   <br><br><button id="pauseRestart">Restart</button>
  </div>
 </div>

 <div id="gameOver" class="overlay hidden">
  <div class="panel">
   <h2>GAME OVER!</h2>
   <p id="finalScore"></p>
   <button class="primary" id="againBtn">PLAY AGAIN</button>
  </div>
 </div>

 <div id="mobile">
  <button class="empty"></button><button data-dir="up">▲</button><button class="empty"></button>
  <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
 </div>
</main>
</div>

<script>
"use strict";

const canvas=$("game");
const ctx=canvas.getContext("2d");
function $(id){return document.getElementById(id)}

const photo=new Image();
photo.src="salman.png";

let W=900,H=600,dpr=1;
let cell=22,cols=40,rows=25;
let snake=[],previousSnake=[];
let direction={x:1,y:0},queued={x:1,y:0};
let book=null,mark=null,particles=[],bookEffect=null;
let score=0,best=Number(localStorage.getItem("snakeSalmanBest")||0);
let running=false,paused=false,ended=false;
let interval=220,last=0,acc=0,markSpawn=45;
let noticeTime=0,raf=0,groundDots=[];

$("best").textContent=best;

function resize(){
 const r=canvas.getBoundingClientRect();
 dpr=Math.min(window.devicePixelRatio||1,2);
 W=Math.max(300,r.width);
 H=Math.max(300,r.height);
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);

 cell=Math.max(13,Math.min(25,Math.floor(Math.min(W/30,H/18))));
 cols=Math.floor(W/cell);
 rows=Math.floor(H/cell);

 groundDots=Array.from({length:65},()=>({
  x:Math.random()*W,y:Math.random()*H,
  r:.8+Math.random()*1.2,a:.07+Math.random()*.12
 }));

 if(running){
  snake=snake.map(p=>({
   x:Math.min(cols-1,Math.max(0,p.x)),
   y:Math.min(rows-1,Math.max(0,p.y))
  }));
  previousSnake=snake.map(p=>({...p}));
  if(book&&(book.x>=cols||book.y>=rows))book=randomCell();
  if(mark&&(mark.x>=cols||mark.y>=rows))mark=null;
 }
 draw(1);
}
window.addEventListener("resize",resize);

function randomCell(){
 for(let i=0;i<1000;i++){
  const p={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};
  if(!snake.some(s=>s.x===p.x&&s.y===p.y)&&
    (!book||book.x!==p.x||book.y!==p.y)&&
    (!mark||mark.x!==p.x||mark.y!==p.y))return p;
 }
 return {x:2,y:2};
}

function center(p){
 return {x:(p.x+.5)*W/cols,y:(p.y+.5)*H/rows};
}

function notify(t){
 $("notice").textContent=t;
 noticeTime=2.2;
}

function updateScore(){
 $("score").textContent=score;
 if(score>best){
  best=score;
  localStorage.setItem("snakeSalmanBest",best);
  $("best").textContent=best;
 }
}

function reset(){
 const cx=Math.floor(cols/2),cy=Math.floor(rows/2);
 snake=[];
 for(let i=0;i<7;i++)snake.push({x:cx-i,y:cy});
 previousSnake=snake.map(p=>({...p}));
 direction={x:1,y:0};
 queued={x:1,y:0};

 score=0;
 updateScore();
 book=null;mark=null;particles=[];bookEffect=null;
 book=randomCell();
 markSpawn=45+Math.random()*25;

 interval=Number($("difficulty").value);
 $("level").textContent=$("difficulty").selectedOptions[0].text.toUpperCase();

 running=true;paused=false;ended=false;acc=0;
 $("startScreen").classList.add("hidden");
 $("pauseScreen").classList.add("hidden");
 $("gameOver").classList.add("hidden");
 $("pauseBtn").textContent="Pause";
 $("timer").textContent="";
 last=performance.now();

 if(raf)cancelAnimationFrame(raf);
 raf=requestAnimationFrame(loop);
}

function finish(){
 running=false;
 ended=true;
 $("finalScore").textContent="Score: "+score+" | Best: "+best;
 $("gameOver").classList.remove("hidden");
 $("pauseBtn").textContent="Pause";
}

function pauseGame(){
 if(!running)return;
 paused=!paused;
 $("pauseScreen").classList.toggle("hidden",!paused);
 $("pauseBtn").textContent=paused?"Resume":"Pause";
 if(!paused){
  last=performance.now();
  raf=requestAnimationFrame(loop);
 }
}

function setDir(x,y){
 if(x===-queued.x&&y===-queued.y)return;
 if(x===-direction.x&&y===-direction.y)return;
 queued={x,y};
}

document.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
 if(k==="arrowup"||k==="w")setDir(0,-1);
 if(k==="arrowdown"||k==="s")setDir(0,1);
 if(k==="arrowleft"||k==="a")setDir(-1,0);
 if(k==="arrowright"||k==="d")setDir(1,0);
 if((k==="p"||k===" ")&&running)pauseGame();
 if(k==="enter"&&!running&&!ended)reset();
 if(k==="r")reset();
});

document.querySelectorAll("#mobile button[data-dir]").forEach(b=>{
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  const d=b.dataset.dir;
  if(d==="up")setDir(0,-1);
  if(d==="down")setDir(0,1);
  if(d==="left")setDir(-1,0);
  if(d==="right")setDir(1,0);
 });
});

$("startBtn").onclick=reset;
$("againBtn").onclick=reset;
$("restartBtn").onclick=reset;
$("pauseRestart").onclick=reset;
$("pauseBtn").onclick=pauseGame;
$("resumeBtn").onclick=pauseGame;

$("difficulty").onchange=()=>{
 interval=Number($("difficulty").value);
 $("level").textContent=$("difficulty").selectedOptions[0].text.toUpperCase();
};

$("fullBtn").onclick=async()=>{
 try{
  if(!document.fullscreenElement)await $("app").requestFullscreen();
  else await document.exitFullscreen();
 }catch(e){notify("Fullscreen unavailable")}
};

function burst(x,y,color){
 for(let i=0;i<12;i++){
  const a=Math.random()*Math.PI*2,v=25+Math.random()*65;
  particles.push({
   x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
   life:.5,color
  });
 }
}

function addLength(n){
 for(let i=0;i<n;i++){
  snake.push({...snake[snake.length-1]});
  previousSnake.push({...snake[snake.length-1]});
 }
}

function collectBook(){
 const p=center(book);
 score+=10;
 updateScore();
 burst(p.x,p.y,"#f3c878");
 bookEffect={...p,t:0};
 addLength(2);
 book=null;
 book=randomCell();
 notify("📖 BOOK OPENED! +10");
}

function collectMark(){
 const p=center(mark);
 score+=30;
 updateScore();
 burst(p.x,p.y,"#9cfaff");
 addLength(5);
 mark=null;
 $("timer").textContent="";
 markSpawn=45+Math.random()*25;
 notify("✨ MARKSHEET COLLECTED! +30");
}

/* Movement and correctly aligned body history */
function step(){
 const old=snake.map(p=>({...p}));
 const nextDirection={...queued};
 const head=snake[0];

 const next={
  x:(head.x+nextDirection.x+cols)%cols,
  y:(head.y+nextDirection.y+rows)%rows
 };

 const eatingBook=book&&next.x===book.x&&next.y===book.y;
 const eatingMark=mark&&next.x===mark.x&&next.y===mark.y;
 const growing=eatingBook||eatingMark;

 const body=growing?snake:snake.slice(0,-1);
 if(body.some(p=>p.x===next.x&&p.y===next.y)){
  finish();
  return;
 }

 direction=nextDirection;
 snake.unshift(next);
 if(!growing)snake.pop();

 // New head previously occupied the old head position.
 // Every other new segment previously occupied the segment before it.
 previousSnake=old.slice(0,snake.length);

 while(previousSnake.length<snake.length){
  previousSnake.push({...old[old.length-1]});
 }

 if(eatingBook)collectBook();
 if(eatingMark)collectMark();
}

/* Rare marksheet timing */
function spawnCheck(dt){
 if(!mark){
  markSpawn-=dt;
  if(markSpawn<=0){
   mark={...randomCell(),life:10};
   notify("✨ MAGICAL MARKSHEET HAS APPEARED!");
  }
 }

 if(mark){
  mark.life-=dt;
  $("timer").textContent="MARKSHEET "+Math.max(0,mark.life).toFixed(1)+"s";

  if(mark.life<=0){
   mark=null;
   $("timer").textContent="";
   markSpawn=45+Math.random()*25;
   notify("The marksheet disappeared!");
  }
 }

 if(noticeTime>0){
  noticeTime-=dt;
  if(noticeTime<=0)$("notice").textContent="";
 }

 if(bookEffect){
  bookEffect.t+=dt;
  if(bookEffect.t>.35)bookEffect=null;
 }

 particles.forEach(p=>{
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.life-=dt;
 });
 particles=particles.filter(p=>p.life>0);
}

/* Original dark hexagonal arena */
function drawArena(){
 const bg=ctx.createRadialGradient(
  W*.5,H*.48,20,W*.5,H*.48,Math.max(W,H)*.8
 );
 bg.addColorStop(0,"#17251b");
 bg.addColorStop(.55,"#0d180f");
 bg.addColorStop(1,"#050a06");
 ctx.fillStyle=bg;
 ctx.fillRect(0,0,W,H);

 const size=25;
 ctx.lineWidth=.65;
 ctx.strokeStyle="rgba(126,165,111,.12)";
 const hexH=Math.sqrt(3)*size;
 const hexW=2*size;

 for(let row=-1;row<H/hexH+2;row++){
  for(let col=-1;col<W/(hexW*.75)+2;col++){
   const x=col*hexW*.75;
   const y=row*hexH+(col%2)*hexH/2;
   ctx.beginPath();
   for(let k=0;k<6;k++){
    const a=Math.PI/3*k;
    const px=x+size*Math.cos(a);
    const py=y+size*Math.sin(a);
    if(k===0)ctx.moveTo(px,py);
    else ctx.lineTo(px,py);
   }
   ctx.closePath();
   ctx.stroke();
  }
 }

 groundDots.forEach(d=>{
  ctx.fillStyle=`rgba(155,220,128,${d.a})`;
  ctx.beginPath();
  ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
  ctx.fill();
 });
}

/* Three overlapping white papers with written lines */
function drawBook(x,y,opening=0){
 ctx.save();
 ctx.translate(x,y);

 const sheets=[
  {x:-7,y:-5,angle:-0.13},
  {x:0,y:-2,angle:0.08},
  {x:6,y:2,angle:0.16}
 ];

 sheets.forEach((s,i)=>{
  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.rotate(s.angle);

  ctx.shadowColor="#0008";
  ctx.shadowBlur=5;
  ctx.fillStyle=i===2?"#fffdf4":"#e8e8dc";
  ctx.fillRect(-12,-16,25,32);
  ctx.shadowBlur=0;

  ctx.strokeStyle="#c5c5b7";
  ctx.lineWidth=.8;
  ctx.strokeRect(-12,-16,25,32);

  ctx.strokeStyle="#7794a0";
  ctx.lineWidth=1;
  for(let j=0;j<4;j++){
   ctx.beginPath();
   ctx.moveTo(-8,-9+j*5);
   ctx.lineTo(8,-9+j*5);
   ctx.stroke();
  }

  ctx.fillStyle="#a44c42";
  ctx.font="bold 4px Arial";
  ctx.textAlign="left";
  ctx.fillText("NOTES",-8,-11);

  ctx.restore();
 });

 ctx.restore();
}

/* Original A+ marksheet */
function drawMark(){
 if(!mark)return;

 const p=center(mark);
 const pulse=1+Math.sin(performance.now()/110)*.08;

 ctx.save();
 ctx.translate(p.x,p.y);
 ctx.scale(pulse,pulse);
 ctx.shadowColor="#b4faff";
 ctx.shadowBlur=28;
 ctx.fillStyle="#fff4c5";
 ctx.fillRect(-23,-30,46,60);
 ctx.shadowBlur=0;
 ctx.strokeStyle="#bd994a";
 ctx.lineWidth=2;
 ctx.strokeRect(-23,-30,46,60);
 ctx.textAlign="center";
 ctx.fillStyle="#a33b35";
 ctx.font="bold 9px Arial";
 ctx.fillText("MARKS",0,-14);
 ctx.fillStyle="#397e4b";
 for(let i=0;i<3;i++)ctx.fillRect(-14,-5+i*10,28,2);
 ctx.font="bold 14px Arial";
 ctx.fillText("A+",0,24);
 ctx.restore();
}

/* Interpolate every segment, accounting for wraparound */
function smoothPoint(i,alpha){
 const current=snake[i];
 const previous=previousSnake[i]||current;

 function interp(a,b,max){
  let d=b-a;
  if(d>max/2)d-=max;
  if(d< -max/2)d+=max;
  return (a+d*alpha+max)%max;
 }

 return {
  x:interp(previous.x,current.x,cols),
  y:interp(previous.y,current.y,rows)
 };
}

function bodyCenter(i,alpha){
 const p=smoothPoint(i,alpha);
 return {
  x:(p.x+.5)*W/cols,
  y:(p.y+.5)*H/rows
 };
}

/* A smooth body with no individual circular beads.
   Each adjacent pair is joined with a rounded stroke.
   Copies at the edges handle wraparound. */
function drawBody(alpha){
 if(snake.length<2)return;

 const color=$("snakeColor").value;
 const points=[];

 for(let i=1;i<snake.length;i++){
  points.push(bodyCenter(i,alpha));
 }

 const width=Math.max(7,cell*.57);

 ctx.lineCap="round";
 ctx.lineJoin="round";

 function drawLink(a,b){
  let dx=b.x-a.x;
  let dy=b.y-a.y;

  if(dx>W/2)dx-=W;
  if(dx< -W/2)dx+=W;
  if(dy>H/2)dy-=H;
  if(dy< -H/2)dy+=H;

  const end={x:a.x+dx,y:a.y+dy};

  for(const ox of [-W,0,W]){
   for(const oy of [-H,0,H]){
    const ax=a.x+ox,ay=a.y+oy;
    const bx=end.x+ox,by=end.y+oy;

    if(Math.max(ax,bx)<-width||Math.min(ax,bx)>W+width||
       Math.max(ay,by)<-width||Math.min(ay,by)>H+width)continue;

    ctx.beginPath();
    ctx.moveTo(ax,ay);
    ctx.lineTo(bx,by);
    ctx.strokeStyle=color;
    ctx.lineWidth=width;
    ctx.stroke();

    // Very subtle top highlight, not circular scales.
    ctx.beginPath();
    ctx.moveTo(ax,ay-width*.12);
    ctx.lineTo(bx,by-width*.12);
    ctx.strokeStyle="rgba(225,245,190,.20)";
    ctx.lineWidth=1;
    ctx.stroke();
   }
  }
 }

 for(let i=0;i<points.length-1;i++){
  drawLink(points[i],points[i+1]);
 }

 // Round tail end, in the same body colour.
 const tail=points[points.length-1];
 ctx.beginPath();
 ctx.arc(tail.x,tail.y,width/2,0,Math.PI*2);
 ctx.fillStyle=color;
 ctx.fill();
}

/* Salman portrait: exactly 50px and circular */
function drawHead(alpha){
 const p=bodyCenter(0,alpha);
 const size=50;

 ctx.save();
 ctx.beginPath();
 ctx.arc(p.x,p.y,size/2,0,Math.PI*2);
 ctx.clip();

 if(photo.complete&&photo.naturalWidth){
  const iw=photo.naturalWidth;
  const ih=photo.naturalHeight;
  const crop=Math.min(iw,ih);

  ctx.drawImage(
   photo,
   (iw-crop)/2,(ih-crop)/2,crop,crop,
   p.x-size/2,p.y-size/2,size,size
  );
 }else{
  ctx.fillStyle="#253c2a";
  ctx.fillRect(p.x-size/2,p.y-size/2,size,size);
 }

 ctx.restore();

 ctx.strokeStyle="#f0d99b";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(p.x,p.y,size/2,0,Math.PI*2);
 ctx.stroke();
}

function draw(alpha=1){
 ctx.clearRect(0,0,W,H);
 drawArena();
 drawBody(alpha);

 if(book){
  const p=center(book);
  drawBook(p.x,p.y);
 }

 if(bookEffect){
  const t=Math.min(1,bookEffect.t/.35);
  ctx.save();
  ctx.globalAlpha=1-t;
  drawBook(bookEffect.x,bookEffect.y,t);
  ctx.restore();
 }

 drawMark();
 if(snake.length)drawHead(alpha);

 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,2,0,Math.PI*2);
  ctx.fill();
 });
 ctx.globalAlpha=1;
}

function loop(now){
 if(!running||paused)return;

 const dt=Math.min((now-last)/1000,.05);
 last=now;
 acc+=dt*1000;

 while(acc>=interval){
  step();
  acc-=interval;
  if(!running)return;
 }

 spawnCheck(dt);
 draw(Math.min(1,acc/interval));
 raf=requestAnimationFrame(loop);
}

resize();
draw();
</script>
</body>
</html>
